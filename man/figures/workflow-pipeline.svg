<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="sptrends-pipeline-title sptrends-pipeline-desc">
<title id="sptrends-pipeline-title">sptrends conceptual pipeline</title>
<desc id="sptrends-pipeline-desc">Five-step pipeline: raw raster data, preprocessing via serial-correlation prewhitening, trend inference via trend tests and slope estimators, multiple-testing correction, and visualisation.</desc>
<defs>
<marker id="sptrends-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 15px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
</style>

<rect x="60" y="10" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="240" y="32" text-anchor="middle" fill="#2C2C2A">Raw data</text>
<text class="ts" x="240" y="50" text-anchor="middle" fill="#444441">Raster time series</text>
<line x1="240" y1="66" x2="240" y2="106" stroke="#5F5E5A" stroke-width="1" marker-end="url(#sptrends-arrow)"/>

<rect x="60" y="106" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="240" y="128" text-anchor="middle" fill="#04342C">Preprocessing</text>
<text class="ts" x="240" y="146" text-anchor="middle" fill="#085041">Serial correlation prewhitening</text>
<line x1="240" y1="162" x2="240" y2="202" stroke="#5F5E5A" stroke-width="1" marker-end="url(#sptrends-arrow)"/>

<rect x="60" y="202" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="240" y="224" text-anchor="middle" fill="#04342C">Trend inference</text>
<text class="ts" x="240" y="242" text-anchor="middle" fill="#085041">Trend tests and slope estimators</text>
<line x1="240" y1="258" x2="240" y2="298" stroke="#5F5E5A" stroke-width="1" marker-end="url(#sptrends-arrow)"/>

<rect x="60" y="298" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="240" y="320" text-anchor="middle" fill="#04342C">Multiple testing</text>
<text class="ts" x="240" y="338" text-anchor="middle" fill="#085041">Correction across many tests</text>
<line x1="240" y1="354" x2="240" y2="394" stroke="#5F5E5A" stroke-width="1" marker-end="url(#sptrends-arrow)"/>

<rect x="60" y="394" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text class="th" x="240" y="416" text-anchor="middle" fill="#2C2C2A">Visualise</text>
<text class="ts" x="240" y="434" text-anchor="middle" fill="#444441">Plot and map results</text>
</svg>
