url: https://olive-r.github.io/sptrends/

template:
  bootstrap: 5

reference:
- title: Published workflows
  desc: >
    sptrends is not a collection of individual statistical functions --
    it is a platform for **published workflows**. Each one below is a
    complete, citable, peer-reviewed method with its own paper, not an
    ad hoc combination this package invented: Robust Trend Analysis
    (RTA, Gutiérrez-Hernández & García, 2024) and True Significant
    Trends (TST, Gutiérrez-Hernández & García, 2025). See `?workflow_tst` and
    `?workflow_rta` for how the two differ and why both are offered, rather than
    one superseding the other. `print()`/`summary()`/`plot()` work the
    same way on every classed object this package returns -- one shared
    entry point per generic (the same convention `terra` itself uses),
    not a differently-named function to remember for each result type.
  contents:
  - workflow_tst
  - workflow_rta
  - print.sptrends
  - summary.sptrends
  - plot.sptrends

- title: Configurable trend workflow
  desc: >
    `workflow_trends()` is not itself a published method -- it lets
    you assemble your own combination of the same prewhitening, trend
    testing, slope estimation and multiple-testing correction methods
    the two published workflows above are built from, for the case
    where neither matches what a given analysis needs. Returns the
    same kind of object `print()`/`summary()`/`plot()` recognise --
    see "Published workflows" above.
  contents:
  - workflow_trends

- title: Preprocessing
  desc: >
    Steps applied to the raw raster time series *before* trend
    estimation or significance testing -- removing serial
    autocorrelation or seasonality that would otherwise distort the
    steps that come after. Neither is one of the core trend-analysis
    pillars itself; both prepare the input for them. `prewhiten()` returns
    a classed result with `print()`/`summary()`/`plot()` methods.
    `compute_anomalies()` returns a plain list: pass `$anomalies` to the
    next stage and inspect its rasters with `terra::plot()`.
  contents:
  - prewhiten
  - compute_anomalies

- title: Core methods
  desc: >
    The classical, individually citable statistical techniques each
    published workflow above is built from -- every one of them usable
    standalone, not only as a step inside `workflow_tst()`/`workflow_rta()`. Each
    function's own help page traces it back to its original
    publication. The four raster analysis functions return classed
    results with `print()`/`summary()`/`plot()` methods. The vector FDR
    helpers and neighbourhood builder return lists described in their
    respective help pages.
  contents:
  - trend_test
  - prepare_cmk_neighbourhood
  - slope_estimator
  - fdr_correction
  - fdr_bh
  - fdr_by
  - fdr_bky
  - spatial_autocorrelation

- title: Diagnostics
  desc: >
    What remains standalone after the redesign: the interactive
    single-cell inspector. Every other diagnostic previously listed
    here (trend/Theil-Sen/prewhitening/FDR/Moran's I summaries,
    histograms, maps, category labels, and the FDR-masked direction
    map) is now reached via `print()`/`summary()`/`plot()` on the
    relevant object -- see "Published workflows" and "Core methods"
    above.
  contents:
  - inspect_ts_cell

- title: Utilities
  desc: >
    Everything else this platform needs around the science: reading
    gridded time series in, simulating synthetic ground truth,
    benchmarking detection methods against it, and the bundled
    real-world example dataset. `compare_detections()` also returns an
    object `print()`/`summary()`/`plot()` recognise -- see "Published
    workflows" above -- while remaining an ordinary data frame
    underneath (indexing, `$`, and so on all still work).
  contents:
  - read_ordered_stack
  - read_netcdf_stack
  - sim_trend_stack
  - simulation_design
  - example_data
  - compare_detections
  - plot_detection_comparison
  - benchmark_methods
  - benchmark_summary

